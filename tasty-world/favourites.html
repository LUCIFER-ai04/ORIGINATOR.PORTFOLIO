<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteWorld - My Favourites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .fav-header {
      padding: 1.25rem 1rem 0.75rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .fav-header h1 {
      font-size: 1.6rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .fav-count { color: var(--text-gray); font-size: 0.9rem; font-weight: 400; }

    .fav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      padding: 0 1rem 6rem;
      max-width: 700px;
      margin: 0 auto;
    }
    @media (min-width: 500px) { .fav-grid { grid-template-columns: repeat(3, 1fr); } }

    .fav-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .fav-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
    .fav-card img { width:100%; height:130px; object-fit:cover; display:block; }
    .fav-card-info { padding: 0.65rem 0.75rem; }
    .fav-card-name { font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
    .fav-card-sub  { font-size: 0.72rem; color: var(--text-gray); margin-top: 0.2rem; }

    .fav-remove {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      background: white;
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-size: 1rem;
      color: #dc2626;
      transition: transform 0.2s;
    }
    .fav-remove:hover { transform: scale(1.2); }

    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-gray);
    }
    .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state h2 { margin-bottom: 0.5rem; }

    .back-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      max-width: 700px;
      margin: 0 auto;
      cursor: pointer;
      color: var(--text-gray);
      font-size: 0.9rem;
    }
    .back-bar:hover { color: var(--primary-500); }
  </style>
</head>
<body>

  <div class="back-bar" onclick="history.back()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back
  </div>

  <div class="fav-header">
    <h1>❤️ My Favourites <span class="fav-count" id="fav-count"></span></h1>
  </div>

  <div class="fav-grid" id="fav-grid">
    <!-- Rendered by JS -->
  </div>

  <nav class="bottom-nav">
    <a href="gallery.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a onclick="window.globalVoice.toggle()" class="nav-item" id="nav-voice-btn" style="cursor:pointer;" title="Tap to speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      Voice
    </a>
    <a href="favourites.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Favourites
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    function renderFavourites() {
      const db = window.RECIPES_DB || [];
      const favIds = getFavourites();
      const grid = document.getElementById('fav-grid');
      const countEl = document.getElementById('fav-count');
      const lang = localStorage.getItem('tw_lang') || 'en';

      countEl.textContent = favIds.length > 0 ? `(${favIds.length})` : '';

      if (favIds.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💔</div>
            <h2>No favourites yet</h2>
            <p>Tap the ❤️ on any recipe to save it here.</p>
            <br>
            <a href="gallery.html" class="btn btn-primary" style="max-width:200px;margin:0 auto;display:flex;">Browse Recipes</a>
          </div>`;
        return;
      }

      grid.innerHTML = '';
      favIds.forEach(id => {
        const r = db.find(x => x.id === id);
        if (!r) return;
        const title = lang === 'ta' && r.name_ta ? r.name_ta : r.name;

        const card = document.createElement('div');
        card.className = 'fav-card fade-in';
        card.innerHTML = `
          <img src="${r.image}" alt="${r.name}" onerror="this.style.background='#f1f5f9';this.style.display='none'">
          <button class="fav-remove" onclick="removeFav(event,'${r.id}')" title="Remove">♥</button>
          <div class="fav-card-info">
            <div class="fav-card-name">${title}</div>
            <div class="fav-card-sub">${r.cuisine} · ${r.prepTime}</div>
          </div>
        `;
        card.onclick = (e) => {
          if (e.target.classList.contains('fav-remove')) return;
          window.location.href = `recipe.html?id=${r.id}`;
        };
        grid.appendChild(card);
      });
    }

    function removeFav(e, id) {
      e.stopPropagation();
      toggleFavourite(id);
      showToast('💔 Removed from favourites');
      renderFavourites();
    }

    // Apply theme before render
    const t = localStorage.getItem('tw_theme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.addEventListener('DOMContentLoaded', renderFavourites);
  </script>
  <script src="js/voice.js"></script>
</body>
</html>
